<!DOCTYPE html>
<html lang="en">
  <head>
      <link rel="stylesheet" href="../style.css">
  </head>
  <body class="card">

    <div class="header">
          <img src="../images/Logo.png" alt="Phishappear" class="logo">
        <nav class="navbar">
          <a href ="../UI/whitelist.html">User Whitelist</a>
          <a href ="../UI/warningPref.html">Warning Preference</a>
          <a href ="../UI/history.html">History</a>
          <a href ="../UI/aiEval.html">AI Evaluation</a>
          <a href ="../UI/about.html">About</a>
        </nav>       
    </div>
  <div class="container"> 
    <div class="noti-container">
      <div class="level-icon active-1"></div>
      <h2 class="risk-title">Safe</h2>
    </div>
    <div class="section safe">
    <label><input type="checkbox" id="safe_popup"> Enable pop-up notification</label>
    <label><input type="checkbox" id="safe_show_level"> Shows threat level on pop-up notification</label>
    </div>


    <div class="noti-container">
      <div class="level-icon active-2"></div>
      <h2 class="risk-title">Low Risk</h2>
    </div>
    <div class="section low">
    <label><input type="checkbox" id="low_popup"> Enable pop-up notification</label>
    <label><input type="checkbox" id="low_show_level"> Shows threat level on pop-up notification</label>
    <label><input type="checkbox" id="low_safe_page"> Enable safe page when click on unsafe link</label>
    </div>


    <div class="noti-container">
      <div class="level-icon active-3"></div>
      <h2 class="risk-title">Moderate Risk</h2>
    </div>
    <div class="section moderate">
    <label><input type="checkbox" id="mod_popup"> Enable pop-up notification</label>
    <label><input type="checkbox" id="mod_show_level"> Shows threat level on pop-up notification</label>
    <label><input type="checkbox" id="mod_safe_page"> Enable safe page when click on unsafe link</label>
    <label><input type="checkbox" id="mod_force"> Enable force interaction with pop-up notification</label>
    </div>


    <div class="noti-container">
      <div class="level-icon active-4"></div>
      <h2 class="risk-title">High Risk</h2>
    </div>
    <div class="section high">
    <label><input type="checkbox" id="high_popup"> Enable pop-up notification</label>
    <label><input type="checkbox" id="high_show_level"> Shows threat level on pop-up notification</label>
    <label><input type="checkbox" id="high_safe_page"> Enable safe page when click on unsafe link</label>
    <label><input type="checkbox" id="high_force"> Enable force interaction with pop-up notification</label>
    <label><input type="checkbox" id="high_return"> Force return user from high risk page</label>
    </div>
</div>



</body>


<script src="../scripts/Warningpref.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    initWarningPrefPage();
  });
</script>

    <div class="footer">
    <p>© 2026</p>
    </div>
</html>
