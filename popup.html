<!DOCTYPE html>
<html lang="en">
  <head>
      <link rel="stylesheet" href="style.css">
  </head>
  <body class="card">

    <div class="header">
          <img src="images/Logo.png" alt="Phishappear" class="logo">
        <div class="header-text">
          <h2>Phishappear</h2>
          <h3>Powered By CNN+LSTM AI</h3>
        </div>       
    </div>


    <div class="link-content">
      <div id="url">Loading...</div>
    </div>
      
    
    <div class="risk-level">
      <div class="bar-seg" id="seg1"></div>
      <div class="bar-seg" id="seg2"></div>
      <div class="bar-seg" id="seg3"></div>
      <div class="bar-seg" id="seg4"></div>
    </div>

    <div class="risk-title">
      <div id="risktitle">
        
      </div>
    </div>

     <!-- Test input (remove when AI is connected) -->
       <div class="input-panel">
      <label for="scoreInput">Test Score (0–1 decimal)</label>
      <div class="input-row">
        <input type="number" id="scoreInput" min="0" max="1" step="0.1" placeholder="e.g. 0.7" />
        <button id="applyBtn">Apply</button>
      </div>
      <div id="errorMsg" class="error-msg"></div>
    </div>
        
      <div class="assess-reason-box">
        <div class="assess-reason">
        <div id="riskLevelScore">Loading</div>
        </div>
      </div>

    </div>

    <div class="footer">
      <button id="openPage">Add to whitelist</button>
    </div>

    

    <script src="securityDisplay.js"></script>

  </body>
</html>
